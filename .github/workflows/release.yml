name: Release to NPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish myship to NPM & GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js for NPM Registry
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Pre-Release Test Suites & Full-Stack E2E Verification
        run: pnpm test && pnpm demo && pnpm demo:fullstack

      - name: Publish to NPM with Provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract Structured Release Notes & Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG_NAME;
            const changelog = fs.existsSync("CHANGELOG.md") ? fs.readFileSync("CHANGELOG.md", "utf8") : "";
            const sections = changelog.split(/^## \[/m);
            const sec = sections.find(s => s.startsWith(tag + "]"));
            let title = `⚓ MyShip ${tag}`;
            let body = `Released **@myship/cli ${tag}** to NPM.\n\n\`\`\`bash\nnpm install -g @myship/cli@${tag.replace(/^v/, "")}\n\`\`\``;
            if (sec) {
              const firstNl = sec.indexOf("\n");
              const headerLine = firstNl !== -1 ? sec.slice(0, firstNl) : sec;
              const subtitle = headerLine.replace(/^[^\]]+\]\s*—\s*/, "").trim();
              if (subtitle) title = `⚓ MyShip ${tag} — ${subtitle}`;
              body = (firstNl !== -1 ? sec.slice(firstNl + 1) : "").replace(/\n---\s*$/, "").trim();
            }
            fs.writeFileSync("/tmp/release-title.txt", title, "utf8");
            fs.writeFileSync("/tmp/release-notes.md", body + "\n", "utf8");
          '
          TITLE="$(cat /tmp/release-title.txt)"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TITLE" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG_NAME" --title "$TITLE" --notes-file /tmp/release-notes.md
          fi
